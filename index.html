<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulateur de notes BTS SIO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <div class="container my-4">
    <h1 class="mb-3">Simulateur de notes BTS SIO</h1>

    <div class="row mb-3">
      <div class="col-md-4">
        <label for="selectMatiere" class="form-label">Matière</label>
        <select id="selectMatiere" class="form-select">
          <!-- Options ajoutées en JavaScript -->
        </select>
      </div>
      <div class="col-md-4">
        <label for="inputNote" class="form-label">Note sur 20</label>
        <input
          type="number"
          id="inputNote"
          class="form-control"
          min="0"
          max="20"
          step="0.5"
        >
      </div>
      <div class="col-md-4 d-flex align-items-end gap-2">
        <button id="btnAjouter" class="btn btn-primary">Ajouter / Modifier la note</button>
        <button id="btnCalculer" class="btn btn-success">Calculer la moyenne</button>
        <button id="btnReset" class="btn btn-outline-secondary">Réinitialiser</button>
      </div>
    </div>

    <div class="table-responsive mb-3">
      <table class="table table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>Matière</th>
            <th>Type</th>
            <th>Coef</th>
            <th>Note</th>
            <th>Points (note × coef)</th>
          </tr>
        </thead>
        <tbody id="tbodyMatieres">
          <!-- Lignes générées en JavaScript -->
        </tbody>
      </table>
    </div>

    <h3>Options facultatives</h3>
<p>Choisis au maximum une option parmi les trois premières.</p>

<label>
  <input type="checkbox" class="option-unique" value="lv2">
  Langue vivante 2
</label>

<label>
  <input type="checkbox" class="option-unique" value="maths">
  Mathématiques approfondies
</label>

<label>
  <input type="checkbox" class="option-unique" value="certification">
  Parcours de certification complémentaire
</label>

<label>
  <input type="checkbox" id="engagement">
  Engagement étudiant
</label>

<div id="notesOptions"></div>

    <div class="alert alert-secondary">
      <p class="mb-1"><strong>Moyenne générale :</strong>
        <span id="spanMoyenne">—</span> / 20</p>
      <p class="mb-0"><strong>Mention :</strong>
        <span id="spanMention">—</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
